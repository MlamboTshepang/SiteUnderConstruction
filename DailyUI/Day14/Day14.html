<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Countdown Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 via-black-500 to-green-500 min-h-screen flex flex-col justify-center items-center font-sans antialiased text-white p-4">

<div class="text-center mb-10">
    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-3 text-white drop-shadow-md">
        Product Launch In
    </h1>
    <p class="text-lg md:text-xl text-indigo-100 font-medium">
        Get ready for something amazing!
    </p>
</div>

<div class="flex flex-wrap justify-center gap-4 md:gap-6 text-center">

    <div class="bg-white/20 backdrop-blur-lg border border-white/30 p-4 md:p-6 rounded-2xl shadow-xl w-24 md:w-32 flex flex-col items-center">
        <span id="days" class="text-4xl md:text-6xl font-bold text-white mb-1">00</span>
        <span class="text-xs md:text-sm font-semibold uppercase tracking-widest text-indigo-100">Days</span>
    </div>

    <div class="bg-white/20 backdrop-blur-lg border border-white/30 p-4 md:p-6 rounded-2xl shadow-xl w-24 md:w-32 flex flex-col items-center">
        <span id="hours" class="text-4xl md:text-6xl font-bold text-white mb-1">00</span>
        <span class="text-xs md:text-sm font-semibold uppercase tracking-widest text-indigo-100">Hours</span>
    </div>

    <div class="bg-white/20 backdrop-blur-lg border border-white/30 p-4 md:p-6 rounded-2xl shadow-xl w-24 md:w-32 flex flex-col items-center">
        <span id="minutes" class="text-4xl md:text-6xl font-bold text-white mb-1">00</span>
        <span class="text-xs md:text-sm font-semibold uppercase tracking-widest text-indigo-100">Minutes</span>
    </div>

    <div class="bg-white/20 backdrop-blur-lg border border-white/30 p-4 md:p-6 rounded-2xl shadow-xl w-24 md:w-32 flex flex-col items-center">
        <span id="seconds" class="text-4xl md:text-6xl font-bold text-white mb-1">00</span>
        <span class="text-xs md:text-sm font-semibold uppercase tracking-widest text-indigo-100">Seconds</span>
    </div>

</div>
<script src="./Day14.js"></script>
</body>
</html>
