<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional User Profile</title>
    <link rel="stylesheet" href="Day6.css">
</head>
<body>
<header>
    <div class="logo"></div>
</header>
<main>
    <section>
        <div class="profile-card">

            <div class="profile-header">
                <img  alt="Cover Photo" class="cover-photo">
                <img  alt="Profile Picture" class="profile-picture">
            </div>

            <div class="profile-body">
                <h1 class="profile-name">Alex Johnson</h1>
                <h2 class="profile-title">Senior Software Engineer</h2>
                <p class="profile-bio">
                    Passionate about building scalable web applications, clean code, and mentoring junior developers. Always eager to learn new technologies.
                </p>

                <div class="skills-list">
                    <span class="skill-tag">JavaScript</span>
                    <span class="skill-tag">React</span>
                    <span class="skill-tag">Node.js</span>
                    <span class="skill-tag">Python</span>
                </div>

                <button class="connect-button" onclick="document.location.href='/DailyUI/Home.html'">Connect</button>
            </div>

        </div>
    </section>
    <section>
        <div>
            <h2> Prompt</h2>
        </div>
    </section>
</main>
<footer> <small>mlambo 2026</small></footer>
</body>
</html>
