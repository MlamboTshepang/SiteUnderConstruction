<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Player</title>
    <link rel="stylesheet" href="Day9.css">
</head>
<body>
<header>
    <h1>Music Player</h1>
</header>
<main>
    <section>
        <div class="music-player">

            <div class="album-art">
                <img src="https://via.placeholder.com/250" alt="Album Cover">
            </div>

            <div class="track-info">
                <h2 class="song-title">Starlight</h2>
                <p class="artist-name">The Coding Band</p>
            </div>

            <div class="progress-container">
                <audio controls></audio>
            </div>

            <div class="controls">
                <button class="control-btn" aria-label="Previous">⏮</button>
                <button class="control-btn play-btn" aria-label="Play">▶</button>
                <button class="control-btn" aria-label="Next">⏭</button>
            </div>

        </div>
    </section>
</main>
</body>
</html>
