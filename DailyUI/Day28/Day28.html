<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Appointment Scheduling</title>
    <link href="Day28.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container d-flex justify-content-center">

    <div class="glass-card">
        <h2 class="text-center mb-4">Book an Appointment</h2>

        <form id="appointmentForm">
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input id="fullName"  type="text" class="form-control glass-input" placeholder="John Doe" required>
                </div>
                <div class="col-md-6">
                    <label for="emailAddress" class="form-label">Email Address</label>
                    <input id="emailAddress"  type="email" class="form-control glass-input" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="serviceType" class="form-label">Service Required</label>
                <select class="form-select glass-select" id="serviceType" required>
                    <option value="" selected disabled>Choose a service...</option>
                    <option value="consultation">Initial Consultation</option>
                    <option value="followup">Follow-up Meeting</option>
                    <option value="support">Technical Support</option>
                </select>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="appointmentDate" class="form-label">Preferred Date</label>
                    <input type="date" class="form-control glass-input" id="appointmentDate" required>
                </div>
                <div class="col-md-6">
                    <label for="appointmentTime" class="form-label">Preferred Time</label>
                    <input type="time" class="form-control glass-input" id="appointmentTime" required>
                </div>
            </div>

            <div class="d-grid">
                <button id="submitBtn" type="submit" class="btn glass-btn py-2">Confirm Appointment</button>
            </div>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
