<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Dropdown Menu</title>
    <style>
        /* Reset basic margins and set a font */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 50px;
            background-color: #f8f9fa;
        }

        .dropdown-container {
            position: relative;
            display: inline-block;
        }

        /* Basic styling for the toggle button */
        .dropdown-toggle {
            padding: 12px 24px;
            background-color: #2c3e50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .dropdown-toggle:hover {
            background-color: #34495e;
        }

        /* The hidden menu */
        .dropdown-menu {
            list-style: none;
            padding: 0;
            margin: 8px 0 0 0;
            background-color: white;
            border-radius: 6px;
            width: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: absolute; /* Keeps it from pushing other content down */
            top: 100%;
            left: 0;

            /* Critical for GSAP animation: */
            height: 0;
            overflow: hidden;
            opacity: 0;
        }

        .dropdown-menu li {
            margin: 0;
            padding: 0;
        }

        .dropdown-menu li a {
            display: block;
            padding: 12px 20px;
            color: #2c3e50;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .dropdown-menu li a:hover {
            background-color: #f1f2f6;
        }
    </style>
</head>
<body>

<div class="dropdown-container">
    <button class="dropdown-toggle">Options Menu ▼</button>

    <ul class="dropdown-menu">
        <li><a href="#">Dashboard</a></li>
        <li><a href="#">Account Settings</a></li>
        <li><a href="#">Billing</a></li>
        <li><a href="#">Notifications</a></li>
        <li><a href="#">Logout</a></li>
    </ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", (event) => {
        const toggleBtn = document.querySelector('.dropdown-toggle');
        const menu = document.querySelector('.dropdown-menu');

        // Create a paused timeline, set to reversed initially
        const tl = gsap.timeline({ paused: true, reversed: true });

        // Animate to height: "auto" and full opacity
        tl.to(menu, {
            duration: 0.35,
            height: "auto",
            opacity: 1,
            ease: "power2.inOut"
        });

        // Toggle functionality on click
        toggleBtn.addEventListener('click', () => {
            if (tl.reversed()) {
                tl.play();
            } else {
                tl.reverse();
            }
        });

        // Optional: Close the dropdown if the user clicks outside of it
        document.addEventListener('click', (e) => {
            if (!toggleBtn.contains(e.target) && !menu.contains(e.target) && !tl.reversed()) {
                tl.reverse();
            }
        });
    });
</script>

</body>
</html>
