<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Art Gallery</title>
    <style>
        /* Use CSS variables for easy editing */
        :root {
            --white: #F2F3F0;
            --red: #D42D1A;
            --blue: #3B669F;
            --yellow: #FBDD5F;
            --black: #222;
            --line-width: 18px;
        }
        body {
            /* Just to center the painting on the page */
            display: grid;
            place-items: center;
            min-height: 90vh;

        }
        .mondrian-painting {
            display: grid;
            width: 500px;
            /* aspect-ratio: 1 / 1; will make it perfectly square */
            height: 500px;
            grid-template-columns: 2fr 5fr 1fr;
            grid-template-rows: 3fr 1fr 2fr;
            gap: var(--line-width); /* 3. This is the key: The 'gap' creates the black lines!*/
            background-color: var(--black); /* The color of the gaps and the outer border */
            border: var(--line-width) solid var(--black);
        }
        .mondrian-painting > div {
            background-color: var(--white);
        }
        .red {
            background-color: red;
            /* This makes the red block span from grid line 1 to 3 (2 rows) */
            grid-row: 1 / 3;
        }
        .blue {
            background-color: blue;
            color: blue;
        }
        .yellow {
            background-color: var(--yellow);
        }
        .black {
            background-color: var(--black);
        }
    </style>
</head>
<body>
<div class="mondrian-painting">
    <div></div>
    <div class="red"></div>
    <div></div>
    <div></div>
    <div class="black"></div>
    <div class="blue">yo</div>
    <div></div>
    <div class="yellow"></div>
</div>
<section>
    <button class="btn" onclick="window.location.href='index.html'"> Press Meh</button>
</section>

</body>
</html>
